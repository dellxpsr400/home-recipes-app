<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Recipes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; min-height: 100vh; }
        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #888; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #555; }
        #recipe-modal, #loader { transition: opacity 0.3s ease; }
        .view-hidden { display: none !important; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

    <!-- Main container -->
    <div class="container mx-auto p-4 md:p-6 max-w-4xl">

        <!-- Header Section -->
        <header class="text-center mb-6 border-b pb-4">
            <div class="flex justify-between items-center mb-2">
                 <button id="show-search-btn" class="text-blue-600 font-semibold hover:underline disabled:text-gray-400 disabled:no-underline" disabled>Recipe Search</button>
                 <button id="show-log-btn" class="text-blue-600 font-semibold hover:underline disabled:text-gray-400 disabled:no-underline">Meal Log</button>
            </div>
            <h1 class="text-3xl md:text-4xl font-bold text-gray-900">My Home Recipes</h1>
            <p id="user-email" class="text-gray-500 text-sm mt-2 h-5"></p>
        </header>

        <!-- Search View -->
        <div id="search-view">
            <main>
                 <!-- Tags/Categories Section -->
                <div class="bg-white p-4 md:p-6 rounded-xl shadow-md mb-6">
                    <h2 class="text-xl md:text-2xl font-semibold mb-4">Filter by Category</h2>
                    <div id="tags-container" class="flex flex-wrap gap-2">
                        <!-- Tag buttons will be dynamically inserted here -->
                    </div>
                </div>

                <div class="bg-white p-4 md:p-6 rounded-xl shadow-md mb-4">
                    <h2 class="text-xl md:text-2xl font-semibold mb-3">Search by Recipe Name</h2>
                    <div class="flex flex-col sm:flex-row gap-3">
                        <input type="text" id="name-search-input" placeholder="e.g., 'Cashew Pie'" class="flex-grow p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
                        <button id="name-search-btn" class="bg-blue-600 text-white font-semibold px-6 py-3 rounded-lg hover:bg-blue-700 transition shadow">Search</button>
                    </div>
                </div>
                <div class="bg-white p-4 md:p-6 rounded-xl shadow-md mb-6">
                    <h2 class="text-xl md:text-2xl font-semibold mb-3">Search by Ingredients</h2>
                    <p class="text-gray-500 mb-3 text-sm">Enter one or more ingredients, separated by commas.</p>
                    <div class="flex flex-col sm:flex-row gap-3">
                        <input type="text" id="ingredient-search-input" placeholder="e.g., 'tomatoes, garlic'" class="flex-grow p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:outline-none transition">
                        <button id="ingredient-search-btn" class="bg-green-600 text-white font-semibold px-6 py-3 rounded-lg hover:bg-green-700 transition shadow">Search</button>
                    </div>
                </div>
                <div class="flex justify-between items-center mb-4">
                    <h3 id="results-header" class="text-lg font-semibold text-gray-700">&nbsp;</h3>
                    <button id="clear-search-btn" class="bg-gray-500 text-white font-semibold px-4 py-2 rounded-lg hover:bg-gray-600 transition shadow-sm text-sm">Clear Search</button>
                </div>
                <div id="results-container" class="space-y-4"></div>
            </main>
        </div>

        <!-- Meal Log View -->
        <div id="log-view" class="view-hidden">
             <h2 class="text-2xl font-bold text-gray-800 mb-4 text-center">Your Meal History</h2>
             <div id="log-container" class="space-y-3"></div>
        </div>

    </div>

    <!-- Recipe Details Modal -->
    <div id="recipe-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 hidden">
        <div id="modal-content" class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] flex flex-col">
            <div class="p-6 border-b border-gray-200 flex justify-between items-center">
                <h2 id="modal-recipe-name" class="text-2xl md:text-3xl font-bold">&nbsp;</h2>
                <button id="close-modal-btn" class="text-gray-500 hover:text-gray-800 text-3xl">&times;</button>
            </div>
            <div id="modal-body" class="p-6 overflow-y-auto custom-scrollbar">
                <div id="log-meal-section" class="bg-blue-50 p-4 rounded-lg mb-6">
                    <h3 class="text-xl font-semibold mb-3">Log this Meal</h3>
                    <div class="flex flex-col sm:flex-row gap-3 items-center">
                        <input type="date" id="log-date-input" class="p-2 border rounded-lg flex-grow w-full sm:w-auto">
                        <button id="save-log-btn" class="bg-blue-600 text-white font-semibold px-5 py-2 rounded-lg hover:bg-blue-700 transition w-full sm:w-auto">Save to Log</button>
                    </div>
                    <p id="log-status-msg" class="text-sm text-green-700 mt-2 h-4"></p>
                </div>
                <div class="mb-6">
                    <h3 class="text-xl font-semibold mb-3">Your History for this Recipe</h3>
                    <ul id="modal-log-history" class="list-disc list-inside space-y-1 text-gray-600"></ul>
                </div>
                <div class="mb-6">
                    <h3 class="text-xl font-semibold mb-3">Ingredients</h3>
                    <ul id="modal-ingredients" class="list-disc list-inside space-y-2"></ul>
                </div>
                <div>
                    <h3 class="text-xl font-semibold mb-3">Instructions</h3>
                    <ol id="modal-instructions" class="list-decimal list-inside space-y-3"></ol>
                </div>
            </div>
        </div>
    </div>
    
    <div id="loader" class="fixed inset-0 bg-white bg-opacity-75 flex items-center justify-center hidden z-50">
        <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-blue-500"></div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        let currentRecipeId = null;

        const getEl = (id) => document.getElementById(id);

        const apiRequest = async (endpoint, options = {}) => {
            getEl('loader').classList.remove('hidden');
            try {
                const response = await fetch(endpoint, options);
                if (!response.ok) {
                    throw new Error(`API Error: ${response.status}`);
                }
                const contentType = response.headers.get("content-type");
                if (contentType && contentType.includes("application/json")) {
                    return response.json();
                }
                return null;
            } catch (error) {
                console.error(`API request to ${endpoint} failed:`, error);
                throw error;
            } finally {
                getEl('loader').classList.add('hidden');
            }
        };
        
        const renderTags = (tags) => {
            const container = getEl('tags-container');
            if (!container) return;
            container.innerHTML = '';
            tags.forEach(tag => {
                const button = document.createElement('button');
                button.className = 'px-3 py-1 bg-gray-200 text-gray-700 rounded-full text-sm font-semibold hover:bg-gray-300 transition';
                button.textContent = tag;
                button.addEventListener('click', () => search('/api/recipes/search/tag', tag));
                container.appendChild(button);
            });
        };

        const renderResults = (results) => {
            const container = getEl('results-container');
            const header = getEl('results-header');
            container.innerHTML = '';
            header.textContent = `Found ${results?.length || 0} recipe(s).`;
            if (!results || results.length === 0) {
                container.innerHTML = '<div class="bg-yellow-100 border-l-4 border-yellow-500 text-yellow-700 p-4 rounded-lg shadow-sm"><p>Try a different search term.</p></div>';
                return;
            }
            results.forEach(recipe => {
                const card = document.createElement('div');
                card.className = 'bg-white p-5 rounded-xl shadow-md';
                let tagsHTML = '';
                if(recipe.tags) {
                    tagsHTML = `<div class="flex flex-wrap gap-2 mt-2">` +
                               recipe.tags.split(',').map(t => `<span class="px-2 py-1 bg-indigo-100 text-indigo-700 rounded-full text-xs">${t.trim()}</span>`).join('') +
                               `</div>`;
                }
                card.innerHTML = `<div class="cursor-pointer" onclick="showRecipeDetails(${recipe.id})">
                                    <span class="text-sm font-semibold text-blue-600">Recipe #${recipe.id}</span>
                                    <h3 class="text-xl font-bold text-gray-800">${recipe.name}</h3>
                                    ${tagsHTML}
                                  </div>`;
                container.appendChild(card);
            });
        };
        
        const fetchAndRenderFullLog = async () => {
            try {
                const logs = await apiRequest('/api/log');
                const container = getEl('log-container');
                container.innerHTML = '';
                if (!logs || logs.length === 0) {
                    container.innerHTML = "<p class='text-center text-gray-500'>You haven't logged any meals yet.</p>";
                    return;
                }
                logs.forEach(log => {
                    const date = new Date(log.eaten_date + 'T00:00:00');
                    const formattedDate = date.toLocaleDateString('en-GB', { year: 'numeric', month: 'long', day: 'numeric' });
                    const logEntry = document.createElement('div');
                    logEntry.className = 'bg-white p-4 rounded-lg shadow-sm';
                    logEntry.innerHTML = `<p class="text-gray-800"><span class="font-bold">${formattedDate}:</span> You ate <a href="#" data-recipe-id="${log.recipe_id}" class="text-blue-600 font-semibold hover:underline">${log.recipe_name}</a>.</p>${log.notes ? `<p class="text-sm text-gray-500 mt-1 pl-4"><em>Note: ${log.notes}</em></p>` : ''}`;
                    container.appendChild(logEntry);
                });
            } catch (error) {
                getEl('log-container').innerHTML = '<p class="text-center text-red-500">Could not load meal history.</p>';
            }
        };

        const switchView = (view) => {
            getEl('search-view').classList.toggle('view-hidden', view !== 'search');
            getEl('log-view').classList.toggle('view-hidden', view !== 'log');
            getEl('show-search-btn').disabled = view === 'search';
            getEl('show-log-btn').disabled = view === 'log';
            if (view === 'log') {
                fetchAndRenderFullLog();
            }
        };

        const search = async (endpoint, query) => {
            if (!query.trim()) return;
            try {
                const results = await apiRequest(`${endpoint}?q=${encodeURIComponent(query.trim())}`);
                renderResults(results);
            } catch (error) { 
                getEl('results-header').textContent = 'Search Error';
                getEl('results-container').innerHTML = '<div class="bg-red-100 border-l-4 border-red-500 text-red-700 p-4 rounded-lg shadow-sm"><p>Could not fetch recipes. Please try again later.</p></div>';
            }
        };

        window.showRecipeDetails = async (recipeId) => {
            currentRecipeId = recipeId;
            try {
                const recipe = await apiRequest(`/api/recipes/${recipeId}`);
                getEl('modal-recipe-name').textContent = recipe.name;
                getEl('modal-ingredients').innerHTML = recipe.ingredients.map(ing => `<li><span class="font-semibold">${ing.quantity} ${ing.name}</span> ${ing.notes ? `<em>(${ing.notes})</em>` : ''}</li>`).join('');
                getEl('modal-instructions').innerHTML = recipe.instructions.map(step => `<li>${step}</li>`).join('');
                await renderModalLogHistory(recipeId);
                getEl('recipe-modal').classList.remove('hidden');
                document.body.style.overflow = 'hidden';
            } catch (error) { alert('Could not load recipe details.'); }
        };

        const renderModalLogHistory = async (recipeId) => {
            const historyEl = getEl('modal-log-history');
            try {
                const logs = await apiRequest(`/api/recipes/${recipeId}/log`);
                historyEl.innerHTML = (!logs || logs.length === 0)
                    ? "<li>You haven't logged this meal yet.</li>"
                    : logs.map(log => {
                        const date = new Date(log.eaten_date + 'T00:00:00');
                        return `<li>${date.toLocaleDateString('en-GB', { year: 'numeric', month: 'long', day: 'numeric' })}</li>`;
                    }).join('');
            } catch (e) {
                historyEl.innerHTML = '<li>Could not load history.</li>';
            }
        };

        const hideModal = () => {
            getEl('recipe-modal').classList.add('hidden');
            document.body.style.overflow = '';
            currentRecipeId = null;
        };
        
        const saveLog = async () => {
            const eaten_date = getEl('log-date-input').value;
            if (!eaten_date || !currentRecipeId) return;
            const msgEl = getEl('log-status-msg');
            msgEl.textContent = 'Saving...';
            try {
                await apiRequest('/api/log', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ recipe_id: currentRecipeId, eaten_date, notes: '' })
                });
                msgEl.textContent = 'Saved successfully!';
                await renderModalLogHistory(currentRecipeId);
                setTimeout(() => { msgEl.textContent = ''; }, 2000);
            } catch (error) {
                msgEl.textContent = 'Failed to save.';
            }
        };

        // --- Event Listeners ---
        getEl('show-search-btn').addEventListener('click', () => switchView('search'));
        getEl('show-log-btn').addEventListener('click', () => switchView('log'));
        getEl('name-search-btn').addEventListener('click', () => search('/api/recipes/search/name', getEl('name-search-input').value));
        getEl('ingredient-search-btn').addEventListener('click', () => search('/api/recipes/search/ingredient', getEl('ingredient-search-input').value));
        getEl('clear-search-btn').addEventListener('click', () => {
            getEl('name-search-input').value = '';
            getEl('ingredient-search-input').value = '';
            getEl('results-container').innerHTML = '';
            getEl('results-header').textContent = '';
        });
        getEl('name-search-input').addEventListener('keyup', e => { if (e.key === 'Enter') search('/api/recipes/search/name', e.target.value); });
        getEl('ingredient-search-input').addEventListener('keyup', e => { if (e.key === 'Enter') search('/api/recipes/search/ingredient', e.target.value); });
        getEl('close-modal-btn').addEventListener('click', hideModal);
        getEl('recipe-modal').addEventListener('click', e => { if (e.target.id === 'recipe-modal') hideModal(); });
        getEl('save-log-btn').addEventListener('click', saveLog);
        
        document.body.addEventListener('click', e => {
            const link = e.target.closest('#log-container a[data-recipe-id]');
            if (link) {
                e.preventDefault();
                showRecipeDetails(link.dataset.recipeId);
            }
        });

        // --- Initial Load ---
        getEl('log-date-input').valueAsDate = new Date();
        
        apiRequest('/api/tags').then(renderTags).catch(err => console.error("Failed to load tags", err));

        apiRequest('/cdn-cgi/access/get-identity')
            .then(identity => {
                if (identity && identity.email) {
                    getEl('user-email').textContent = 'Logged in as: ' + identity.email;
                }
            })
            .catch(() => {
                getEl('user-email').textContent = 'Not logged in (this is normal for local testing).';
            });
    });
    </script>
</body>
</html>
