<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Recipes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; min-height: 100vh; }
        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #888; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #555; }
        #recipeModal, #loader { transition: opacity 0.3s ease; }
        .view-hidden { display: none !important; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

    <!-- Main container -->
    <div class="container mx-auto p-4 md:p-6 max-w-4xl">

        <!-- Header Section -->
        <header class="text-center mb-6 border-b pb-4">
            <div class="flex justify-between items-center mb-2">
                 <button id="showSearchBtn" class="text-blue-600 font-semibold hover:underline disabled:text-gray-400 disabled:no-underline" disabled>Recipe Search</button>
                 <button id="showLogBtn" class="text-blue-600 font-semibold hover:underline disabled:text-gray-400 disabled:no-underline">Meal Log</button>
            </div>
            <h1 class="text-3xl md:text-4xl font-bold text-gray-900">My Home Recipes</h1>
            <p id="user-email" class="text-gray-500 text-sm mt-2 h-5"></p>
        </header>

        <!-- Search View -->
        <div id="search-view">
            <main>
                <!-- Search by Recipe Name -->
                <div class="bg-white p-4 md:p-6 rounded-xl shadow-md mb-4">
                    <h2 class="text-xl md:text-2xl font-semibold mb-3">Search by Recipe Name</h2>
                    <div class="flex flex-col sm:flex-row gap-3">
                        <input type="text" id="nameSearchInput" placeholder="e.g., 'Cashew Pie'" class="flex-grow p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
                        <button id="nameSearchBtn" class="bg-blue-600 text-white font-semibold px-6 py-3 rounded-lg hover:bg-blue-700 transition shadow">Search</button>
                    </div>
                </div>
                <!-- Search by Ingredients -->
                <div class="bg-white p-4 md:p-6 rounded-xl shadow-md mb-6">
                    <h2 class="text-xl md:text-2xl font-semibold mb-3">Search by Ingredients</h2>
                    <p class="text-gray-500 mb-3 text-sm">Enter one or more ingredients, separated by commas.</p>
                    <div class="flex flex-col sm:flex-row gap-3">
                        <input type="text" id="ingredientSearchInput" placeholder="e.g., 'tomatoes, garlic'" class="flex-grow p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:outline-none transition">
                        <button id="ingredientSearchBtn" class="bg-green-600 text-white font-semibold px-6 py-3 rounded-lg hover:bg-green-700 transition shadow">Search</button>
                    </div>
                </div>
                <!-- Results Header and Clear Button -->
                <div class="flex justify-between items-center mb-4">
                    <h3 id="resultsHeader" class="text-lg font-semibold text-gray-700"></h3>
                    <button id="clearSearchBtn" class="bg-gray-500 text-white font-semibold px-4 py-2 rounded-lg hover:bg-gray-600 transition shadow-sm text-sm">Clear Search</button>
                </div>
                <div id="resultsContainer" class="space-y-4"></div>
            </main>
        </div>

        <!-- Meal Log View -->
        <div id="log-view" class="view-hidden">
             <h2 class="text-2xl font-bold text-gray-800 mb-4 text-center">Your Meal History</h2>
             <div id="logContainer" class="space-y-3"></div>
        </div>

    </div>

    <!-- Recipe Details Modal -->
    <div id="recipeModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 hidden">
        <div id="modalContent" class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] flex flex-col">
            <div class="p-6 border-b border-gray-200 flex justify-between items-center">
                <h2 id="modalRecipeName" class="text-2xl md:text-3xl font-bold"></h2>
                <button id="closeModalBtn" class="text-gray-500 hover:text-gray-800 text-3xl">&times;</button>
            </div>
            <div id="modal-body" class="p-6 overflow-y-auto custom-scrollbar">
                <!-- Log a Meal Section -->
                <div id="log-meal-section" class="bg-blue-50 p-4 rounded-lg mb-6">
                    <h3 class="text-xl font-semibold mb-3">Log this Meal</h3>
                    <div class="flex flex-col sm:flex-row gap-3 items-center">
                        <input type="date" id="log-date-input" class="p-2 border rounded-lg flex-grow w-full sm:w-auto">
                        <button id="save-log-btn" class="bg-blue-600 text-white font-semibold px-5 py-2 rounded-lg hover:bg-blue-700 transition w-full sm:w-auto">Save to Log</button>
                    </div>
                    <p id="log-status-msg" class="text-sm text-green-700 mt-2 h-4"></p>
                </div>
                <!-- Meal History Section -->
                <div class="mb-6">
                    <h3 class="text-xl font-semibold mb-3">Your History for this Recipe</h3>
                    <ul id="modal-log-history" class="list-disc list-inside space-y-1 text-gray-600"></ul>
                </div>
                <div class="mb-6">
                    <h3 class="text-xl font-semibold mb-3">Ingredients</h3>
                    <ul id="modalIngredients" class="list-disc list-inside space-y-2"></ul>
                </div>
                <div>
                    <h3 class="text-xl font-semibold mb-3">Instructions</h3>
                    <ol id="modalInstructions" class="list-decimal list-inside space-y-3"></ul>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Loader element -->
    <div id="loader" class="fixed inset-0 bg-white bg-opacity-75 flex items-center justify-center hidden z-50">
        <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-blue-500"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- Global state
            let currentRecipeId = null;

            // --- DOM Element References ---
            const nameSearchInput = document.getElementById('nameSearchInput');
            const nameSearchBtn = document.getElementById('nameSearchBtn');
            const ingredientSearchInput = document.getElementById('ingredientSearchInput');
            const ingredientSearchBtn = document.getElementById('ingredientSearchBtn');
            const resultsContainer = document.getElementById('resultsContainer');
            const resultsHeader = document.getElementById('resultsHeader');
            const clearSearchBtn = document.getElementById('clearSearchBtn');
            const userEmailDisplay = document.getElementById('user-email');
            
            const showSearchBtn = document.getElementById('showSearchBtn');
            const showLogBtn = document.getElementById('showLogBtn');
            const searchView = document.getElementById('search-view');
            const logView = document.getElementById('log-view');
            const logContainer = document.getElementById('logContainer');

            // Modal elements
            const recipeModal = document.getElementById('recipeModal');
            const closeModalBtn = document.getElementById('closeModalBtn');
            const modalRecipeName = document.getElementById('modalRecipeName');
            const modalIngredients = document.getElementById('modalIngredients');
            const modalInstructions = document.getElementById('modalInstructions');
            const modalLogHistory = document.getElementById('modal-log-history');
            const logDateInput = document.getElementById('log-date-input');
            const saveLogBtn = document.getElementById('save-log-btn');
            const logStatusMsg = document.getElementById('log-status-msg');

            const loader = document.getElementById('loader');
            const showLoader = (show) => loader.classList.toggle('hidden', !show);
            
            // --- Core App Logic ---
            
            const initializeApp = () => {
                try {
                    setupEventListeners();
                    fetchUserInfo();
                } catch (error) {
                    console.error("Critical error during app initialization:", error);
                    alert("A critical error occurred. The app might not be fully functional. Please check the console.");
                }
            };

            const setupEventListeners = () => {
                try {
                    showSearchBtn.addEventListener('click', () => switchView('search'));
                    showLogBtn.addEventListener('click', () => switchView('log'));
                    nameSearchBtn.addEventListener('click', searchByName);
                    ingredientSearchBtn.addEventListener('click', searchByIngredients);
                    clearSearchBtn.addEventListener('click', clearSearch);
                    nameSearchInput.addEventListener('keyup', (e) => { if (e.key === 'Enter') searchByName(); });
                    ingredientSearchInput.addEventListener('keyup', (e) => { if (e.key === 'Enter') searchByIngredients(); });
                    closeModalBtn.addEventListener('click', hideModal);
                    recipeModal.addEventListener('click', (e) => { if (e.target === recipeModal) hideModal(); });
                    saveLogBtn.addEventListener('click', saveLog);
                    
                    logDateInput.valueAsDate = new Date(); // Set default date to today

                    document.body.addEventListener('click', (e) => {
                        if (e.target && e.target.matches('#logContainer a[data-recipe-id]')) {
                            e.preventDefault();
                            const recipeId = e.target.getAttribute('data-recipe-id');
                            showRecipeDetails(recipeId);
                        }
                    });
                } catch(error) {
                    console.error("Error setting up event listeners:", error);
                }
            };

            // --- API Functions ---
            const apiRequest = async (endpoint, options = {}) => {
                showLoader(true);
                try {
                    const response = await fetch(endpoint, options);
                    if (!response.ok) {
                        const errorText = await response.text();
                        console.error(`API Error Response for ${endpoint}:`, errorText);
                        throw new Error(`Request failed with status ${response.status}`);
                    }
                    const contentType = response.headers.get("content-type");
                    if (contentType && contentType.indexOf("application/json") !== -1) {
                        return response.json();
                    }
                    return null; // Handle non-JSON responses
                } catch (error) {
                    console.error(`API Error on ${endpoint}:`, error);
                    throw error;
                } finally {
                    showLoader(false);
                }
            };
            
            // --- View and Data Functions ---

            const switchView = (viewToShow) => {
                searchView.classList.toggle('view-hidden', viewToShow !== 'search');
                logView.classList.toggle('view-hidden', viewToShow !== 'log');
                showSearchBtn.disabled = viewToShow === 'search';
                showLogBtn.disabled = viewToShow === 'log';
                if (viewToShow === 'log') fetchAndRenderFullLog();
            };

            const fetchAndRenderFullLog = async () => {
                try {
                    const logs = await apiRequest('/api/log');
                    logContainer.innerHTML = '';
                    if (!logs || logs.length === 0) {
                        logContainer.innerHTML = '<p class="text-center text-gray-500">You haven''t logged any meals yet.</p>';
                        return;
                    }
                    logs.forEach(log => {
                        const date = new Date(log.eaten_date + 'T00:00:00');
                        const formattedDate = date.toLocaleDateString('en-GB', { year: 'numeric', month: 'long', day: 'numeric' });
                        const logEntry = document.createElement('div');
                        logEntry.className = 'bg-white p-4 rounded-lg shadow-sm';
                        logEntry.innerHTML = `
                            <p class="text-gray-800">
                                <span class="font-bold">${formattedDate}:</span> You ate 
                                <a href="#" data-recipe-id="${log.recipe_id}" class="text-blue-600 font-semibold hover:underline">${log.recipe_name}</a>.
                            </p>
                            ${log.notes ? `<p class="text-sm text-gray-500 mt-1 pl-4"><em>Note: ${log.notes}</em></p>` : ''}
                        `;
                        logContainer.appendChild(logEntry);
                    });
                } catch (error) {
                    logContainer.innerHTML = `<p class="text-center text-red-500">Could not load your meal history.</p>`;
                }
            };
            
            const searchByName = async () => {
                const query = nameSearchInput.value.trim();
                if (!query) return;
                try {
                    const results = await apiRequest(`/api/recipes/search/name?q=${encodeURIComponent(query)}`);
                    renderResults(results);
                } catch (error) {
                    renderError('Could not fetch recipes.');
                }
            };

            const searchByIngredients = async () => {
                const query = ingredientSearchInput.value.trim();
                if (!query) return;
                try {
                    const results = await apiRequest(`/api/recipes/search/ingredient?q=${encodeURIComponent(query)}`);
                    renderResults(results);
                } catch (error) {
                    renderError('Could not fetch recipes.');
                }
            };

            const clearSearch = () => {
                nameSearchInput.value = '';
                ingredientSearchInput.value = '';
                resultsContainer.innerHTML = '';
                resultsHeader.textContent = '';
            };

            const renderResults = (results) => {
                resultsContainer.innerHTML = '';
                if (!results || results.length === 0) {
                    resultsHeader.textContent = 'Found 0 recipes.';
                    resultsContainer.innerHTML = `<div class="bg-yellow-100 border-l-4 border-yellow-500 text-yellow-700 p-4 rounded-lg shadow-sm" role="alert"><p>Try a different search term.</p></div>`;
                    return;
                }
                resultsHeader.textContent = `Found ${results.length} recipe(s).`;
                results.forEach(recipe => {
                    const resultCard = document.createElement('div');
                    resultCard.className = 'bg-white p-5 rounded-xl shadow-md flex justify-between items-center cursor-pointer hover:shadow-lg hover:scale-105 transition-transform duration-200';
                    resultCard.innerHTML = `<div><span class="text-sm font-semibold text-blue-600">Recipe #${recipe.id}</span><h3 class="text-xl font-bold text-gray-800">${recipe.name}</h3></div><button class="bg-gray-800 text-white font-semibold px-4 py-2 rounded-lg hover:bg-black transition">View</button>`;
                    resultCard.addEventListener('click', () => showRecipeDetails(recipe.id));
                    resultsContainer.appendChild(resultCard);
                });
            };

            const renderError = (message) => {
                resultsHeader.textContent = 'Search Error';
                resultsContainer.innerHTML = `<div class="bg-red-100 border-l-4 border-red-500 text-red-700 p-4 rounded-lg shadow-sm" role="alert"><p>${message}</p></div>`;
            };

            const showRecipeDetails = async (recipeId) => {
                currentRecipeId = recipeId;
                try {
                    const recipe = await apiRequest(`/api/recipes/${recipeId}`);
                    modalRecipeName.textContent = recipe.name;
                    modalIngredients.innerHTML = recipe.ingredients.map(ing => `<li><span class="font-semibold">${ing.quantity} ${ing.name}</span> ${ing.notes ? `<em>(${ing.notes})</em>` : ''}</li>`).join('');
                    modalInstructions.innerHTML = recipe.instructions.map(step => `<li>${step}</li>`).join('');
                    
                    await fetchAndRenderModalLogHistory(recipeId);

                    recipeModal.classList.remove('hidden');
                    document.body.style.overflow = 'hidden';
                } catch (error) {
                    alert('Could not load recipe details.');
                }
            };
            
            const fetchAndRenderModalLogHistory = async (recipeId) => {
                try {
                    const logs = await apiRequest(`/api/recipes/${recipeId}/log`);
                    modalLogHistory.innerHTML = '';
                    if (!logs || logs.length === 0) {
                        modalLogHistory.innerHTML = '<li>You haven''t logged this meal yet.</li>';
                    } else {
                        logs.forEach(log => {
                             const date = new Date(log.eaten_date + 'T00:00:00');
                             const formattedDate = date.toLocaleDateString('en-GB', { year: 'numeric', month: 'long', day: 'numeric' });
                             modalLogHistory.innerHTML += `<li>${formattedDate}</li>`;
                        });
                    }
                } catch(e){
                     modalLogHistory.innerHTML = '<li>Could not load history.</li>';
                }
            };

            const hideModal = () => {
                recipeModal.classList.add('hidden');
                document.body.style.overflow = '';
                currentRecipeId = null;
            };
            
            const saveLog = async () => {
                const eaten_date = logDateInput.value;
                if (!eaten_date || !currentRecipeId) return;

                logStatusMsg.textContent = 'Saving...';
                try {
                    const options = {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ recipe_id: currentRecipeId, eaten_date, notes: '' })
                    };
                    await apiRequest('/api/log', options);
                    logStatusMsg.textContent = 'Saved successfully!';
                    await fetchAndRenderModalLogHistory(currentRecipeId);
                    setTimeout(() => logStatusMsg.textContent = '', 2000);
                } catch (error) {
                     logStatusMsg.textContent = 'Failed to save.';
                }
            };
            
            const fetchUserInfo = async () => {
                try {
                    const identity = await apiRequest('/cdn-cgi/access/get-identity');
                    if (identity && identity.email) {
                        userEmailDisplay.textContent = `Logged in as: ${identity.email}`;
                    }
                } catch (e) {
                    console.error('Could not fetch user identity. This is normal during local development if not logged in.');
                    userEmailDisplay.textContent = 'Could not verify user. Please log in.';
                }
            };
            
            initializeApp();
        });
    </script>
</body>
</html>
