<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Recipes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; min-height: 100vh; }
        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #888; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #555; }
        #recipeModal, #loader { transition: opacity 0.3s ease; }
        .view-hidden { display: none !important; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

    <!-- Main container -->
    <div class="container mx-auto p-4 md:p-6 max-w-4xl">

        <!-- Header Section -->
        <header class="text-center mb-6 border-b pb-4">
            <div class="flex justify-between items-center mb-2">
                 <button id="showSearchBtn" class="text-blue-600 font-semibold hover:underline disabled:text-gray-400 disabled:no-underline" disabled>Recipe Search</button>
                 <button id="showLogBtn" class="text-blue-600 font-semibold hover:underline disabled:text-gray-400 disabled:no-underline">Meal Log</button>
            </div>
            <h1 class="text-3xl md:text-4xl font-bold text-gray-900">My Home Recipes</h1>
            <p id="user-email" class="text-gray-500 text-sm mt-2 h-5"></p>
        </header>

        <!-- Search View -->
        <div id="search-view">
            <main>
                <div class="bg-white p-4 md:p-6 rounded-xl shadow-md mb-4">
                    <h2 class="text-xl md:text-2xl font-semibold mb-3">Search by Recipe Name</h2>
                    <div class="flex flex-col sm:flex-row gap-3">
                        <input type="text" id="nameSearchInput" placeholder="e.g., 'Cashew Pie'" class="flex-grow p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
                        <button id="nameSearchBtn" class="bg-blue-600 text-white font-semibold px-6 py-3 rounded-lg hover:bg-blue-700 transition shadow">Search</button>
                    </div>
                </div>
                <div class="bg-white p-4 md:p-6 rounded-xl shadow-md mb-6">
                    <h2 class="text-xl md:text-2xl font-semibold mb-3">Search by Ingredients</h2>
                    <p class="text-gray-500 mb-3 text-sm">Enter one or more ingredients, separated by commas.</p>
                    <div class="flex flex-col sm:flex-row gap-3">
                        <input type="text" id="ingredientSearchInput" placeholder="e.g., 'tomatoes, garlic'" class="flex-grow p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:outline-none transition">
                        <button id="ingredientSearchBtn" class="bg-green-600 text-white font-semibold px-6 py-3 rounded-lg hover:bg-green-700 transition shadow">Search</button>
                    </div>
                </div>
                <div class="flex justify-between items-center mb-4">
                    <h3 id="resultsHeader" class="text-lg font-semibold text-gray-700">&nbsp;</h3>
                    <button id="clearSearchBtn" class="bg-gray-500 text-white font-semibold px-4 py-2 rounded-lg hover:bg-gray-600 transition shadow-sm text-sm">Clear Search</button>
                </div>
                <div id="resultsContainer" class="space-y-4"></div>
            </main>
        </div>

        <!-- Meal Log View -->
        <div id="log-view" class="view-hidden">
             <h2 class="text-2xl font-bold text-gray-800 mb-4 text-center">Your Meal History</h2>
             <div id="logContainer" class="space-y-3"></div>
        </div>

    </div>

    <!-- Recipe Details Modal -->
    <div id="recipeModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 hidden">
        <div id="modalContent" class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] flex flex-col">
            <div class="p-6 border-b border-gray-200 flex justify-between items-center">
                <h2 id="modalRecipeName" class="text-2xl md:text-3xl font-bold">&nbsp;</h2>
                <button id="closeModalBtn" class="text-gray-500 hover:text-gray-800 text-3xl">&times;</button>
            </div>
            <div id="modal-body" class="p-6 overflow-y-auto custom-scrollbar">
                <div id="log-meal-section" class="bg-blue-50 p-4 rounded-lg mb-6">
                    <h3 class="text-xl font-semibold mb-3">Log this Meal</h3>
                    <div class="flex flex-col sm:flex-row gap-3 items-center">
                        <input type="date" id="log-date-input" class="p-2 border rounded-lg flex-grow w-full sm:w-auto">
                        <button id="save-log-btn" class="bg-blue-600 text-white font-semibold px-5 py-2 rounded-lg hover:bg-blue-700 transition w-full sm:w-auto">Save to Log</button>
                    </div>
                    <p id="log-status-msg" class="text-sm text-green-700 mt-2 h-4"></p>
                </div>
                <div class="mb-6">
                    <h3 class="text-xl font-semibold mb-3">Your History for this Recipe</h3>
                    <ul id="modal-log-history" class="list-disc list-inside space-y-1 text-gray-600"></ul>
                </div>
                <div class="mb-6">
                    <h3 class="text-xl font-semibold mb-3">Ingredients</h3>
                    <ul id="modalIngredients" class="list-disc list-inside space-y-2"></ul>
                </div>
                <div>
                    <h3 class="text-xl font-semibold mb-3">Instructions</h3>
                    <ol id="modalInstructions" class="list-decimal list-inside space-y-3"></ol>
                </div>
            </div>
        </div>
    </div>
    
    <div id="loader" class="fixed inset-0 bg-white bg-opacity-75 flex items-center justify-center hidden z-50">
        <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-blue-500"></div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        try {
            const app = {
                currentRecipeId: null,
                elements: {},

                init() {
                    this.cacheDOMElements();
                    this.setupEventListeners();
                    this.fetchUserInfo();
                },

                // CORRECTED: This function now converts kebab-case IDs to camelCase properties
                // to match how they are called in the rest of the code.
                cacheDOMElements() {
                    const toCamelCase = (str) => str.replace(/-([a-z])/g, g => g[1].toUpperCase());
                    const ids = [
                        'name-search-input', 'name-search-btn', 'ingredient-search-input', 'ingredient-search-btn', 
                        'results-container', 'results-header', 'clear-search-btn', 'user-email', 'show-search-btn', 
                        'show-log-btn', 'search-view', 'log-view', 'log-container', 'recipe-modal', 'close-modal-btn', 
                        'modal-recipe-name', 'modal-ingredients', 'modal-instructions', 'modal-log-history', 
                        'log-date-input', 'save-log-btn', 'log-status-msg', 'loader'
                    ];
                    ids.forEach(id => {
                        this.elements[toCamelCase(id)] = document.getElementById(id);
                    });
                },

                setupEventListeners() {
                    const addListener = (element, event, handler) => {
                        if (element) {
                            element.addEventListener(event, handler);
                        } else {
                            // This check is now redundant because of the fix, but good for safety.
                        }
                    };

                    addListener(this.elements.showSearchBtn, 'click', () => this.switchView('search'));
                    addListener(this.elements.showLogBtn, 'click', () => this.switchView('log'));
                    addListener(this.elements.nameSearchBtn, 'click', () => this.searchByName());
                    addListener(this.elements.ingredientSearchBtn, 'click', () => this.searchByIngredients());
                    addListener(this.elements.clearSearchBtn, 'click', () => this.clearSearch());
                    addListener(this.elements.nameSearchInput, 'keyup', e => { if (e.key === 'Enter') this.searchByName(); });
                    addListener(this.elements.ingredientSearchInput, 'keyup', e => { if (e.key === 'Enter') this.searchByIngredients(); });
                    addListener(this.elements.closeModalBtn, 'click', () => this.hideModal());
                    addListener(this.elements.recipeModal, 'click', e => { if (e.target === this.elements.recipeModal) this.hideModal(); });
                    addListener(this.elements.saveLogBtn, 'click', () => this.saveLog());
                    
                    if (this.elements.logDateInput) {
                        this.elements.logDateInput.valueAsDate = new Date();
                    }

                    document.body.addEventListener('click', e => {
                        const link = e.target.closest('#logContainer a[data-recipe-id]');
                        if (link) {
                            e.preventDefault();
                            this.showRecipeDetails(link.dataset.recipeId);
                        }
                    });
                },

                async apiRequest(endpoint, options = {}) {
                    this.showLoader(true);
                    try {
                        const response = await fetch(endpoint, options);
                        if (!response.ok) {
                             const errorText = await response.text();
                             throw new Error(`API Error: ${response.status} - ${errorText}`);
                        }
                        if (response.headers.get("content-type")?.includes("application/json")) {
                            return response.json();
                        }
                        return null;
                    } catch (error) {
                        console.error(`API request to ${endpoint} failed:`, error);
                        throw error;
                    } finally {
                        this.showLoader(false);
                    }
                },

                showLoader(show) { if (this.elements.loader) this.elements.loader.classList.toggle('hidden', !show); },
                
                switchView(view) {
                    this.elements.searchView.classList.toggle('view-hidden', view !== 'search');
                    this.elements.logView.classList.toggle('view-hidden', view !== 'log');
                    this.elements.showSearchBtn.disabled = view === 'search';
                    this.elements.showLogBtn.disabled = view === 'log';
                    if (view === 'log') this.fetchAndRenderFullLog();
                },

                async fetchAndRenderFullLog() {
                    try {
                        const logs = await this.apiRequest('/api/log');
                        this.elements.logContainer.innerHTML = '';
                        if (!logs || logs.length === 0) {
                            this.elements.logContainer.innerHTML = "<p class='text-center text-gray-500'>You haven't logged any meals yet.</p>";
                            return;
                        }
                        logs.forEach(log => {
                            const date = new Date(log.eaten_date + 'T00:00:00');
                            const formattedDate = date.toLocaleDateString('en-GB', { year: 'numeric', month: 'long', day: 'numeric' });
                            const logEntry = document.createElement('div');
                            logEntry.className = 'bg-white p-4 rounded-lg shadow-sm';
                            logEntry.innerHTML = `<p class="text-gray-800"><span class="font-bold">${formattedDate}:</span> You ate <a href="#" data-recipe-id="${log.recipe_id}" class="text-blue-600 font-semibold hover:underline">${log.recipe_name}</a>.</p>${log.notes ? `<p class="text-sm text-gray-500 mt-1 pl-4"><em>Note: ${log.notes}</em></p>` : ''}`;
                            this.elements.logContainer.appendChild(logEntry);
                        });
                    } catch (error) {
                        this.elements.logContainer.innerHTML = '<p class="text-center text-red-500">Could not load meal history.</p>';
                    }
                },

                async searchByName() { this.search('/api/recipes/search/name', this.elements.nameSearchInput.value); },
                async searchByIngredients() { this.search('/api/recipes/search/ingredient', this.elements.ingredientSearchInput.value); },
                
                async search(endpoint, query) {
                    if (!query.trim()) return;
                    try {
                        const results = await this.apiRequest(`${endpoint}?q=${encodeURIComponent(query.trim())}`);
                        this.renderResults(results);
                    } catch (error) { this.renderError(); }
                },

                clearSearch() {
                    this.elements.nameSearchInput.value = '';
                    this.elements.ingredientSearchInput.value = '';
                    this.elements.resultsContainer.innerHTML = '';
                    this.elements.resultsHeader.textContent = '';
                },

                renderResults(results) {
                    this.elements.resultsContainer.innerHTML = '';
                    this.elements.resultsHeader.textContent = `Found ${results?.length || 0} recipe(s).`;
                    if (!results || results.length === 0) {
                        this.elements.resultsContainer.innerHTML = '<div class="bg-yellow-100 border-l-4 border-yellow-500 text-yellow-700 p-4 rounded-lg shadow-sm"><p>Try a different search term.</p></div>';
                        return;
                    }
                    results.forEach(recipe => {
                        const card = document.createElement('div');
                        card.className = 'bg-white p-5 rounded-xl shadow-md flex justify-between items-center cursor-pointer hover:shadow-lg hover:scale-105 transition-transform duration-200';
                        card.innerHTML = `<div><span class="text-sm font-semibold text-blue-600">Recipe #${recipe.id}</span><h3 class="text-xl font-bold text-gray-800">${recipe.name}</h3></div><button class="bg-gray-800 text-white font-semibold px-4 py-2 rounded-lg hover:bg-black transition">View</button>`;
                        card.addEventListener('click', () => this.showRecipeDetails(recipe.id));
                        this.elements.resultsContainer.appendChild(card);
                    });
                },

                renderError() {
                    this.elements.resultsHeader.textContent = 'Search Error';
                    this.elements.resultsContainer.innerHTML = '<div class="bg-red-100 border-l-4 border-red-500 text-red-700 p-4 rounded-lg shadow-sm"><p>Could not fetch recipes. Please try again later.</p></div>';
                },

                async showRecipeDetails(recipeId) {
                    this.currentRecipeId = recipeId;
                    try {
                        const recipe = await this.apiRequest(`/api/recipes/${recipeId}`);
                        this.elements.modalRecipeName.textContent = recipe.name;
                        this.elements.modalIngredients.innerHTML = recipe.ingredients.map(ing => `<li><span class="font-semibold">${ing.quantity} ${ing.name}</span> ${ing.notes ? `<em>(${ing.notes})</em>` : ''}</li>`).join('');
                        this.elements.modalInstructions.innerHTML = recipe.instructions.map(step => `<li>${step}</li>`).join('');
                        await this.fetchAndRenderModalLogHistory(recipeId);
                        this.elements.recipeModal.classList.remove('hidden');
                        document.body.style.overflow = 'hidden';
                    } catch (error) { alert('Could not load recipe details.'); }
                },

                async fetchAndRenderModalLogHistory(recipeId) {
                    try {
                        const logs = await this.apiRequest(`/api/recipes/${recipeId}/log`);
                        this.elements.modalLogHistory.innerHTML = (!logs || logs.length === 0)
                            ? "<li>You haven't logged this meal yet.</li>"
                            : logs.map(log => {
                                const date = new Date(log.eaten_date + 'T00:00:00');
                                const formattedDate = date.toLocaleDateString('en-GB', { year: 'numeric', month: 'long', day: 'numeric' });
                                return `<li>${formattedDate}</li>`;
                            }).join('');
                    } catch (e) {
                        this.elements.modalLogHistory.innerHTML = '<li>Could not load history.</li>';
                    }
                },

                hideModal() {
                    this.elements.recipeModal.classList.add('hidden');
                    document.body.style.overflow = '';
                    this.currentRecipeId = null;
                },

                async saveLog() {
                    const eaten_date = this.elements.logDateInput.value;
                    if (!eaten_date || !this.currentRecipeId) return;
                    this.elements.logStatusMsg.textContent = 'Saving...';
                    try {
                        await this.apiRequest('/api/log', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ recipe_id: this.currentRecipeId, eaten_date: eaten_date, notes: '' })
                        });
                        this.elements.logStatusMsg.textContent = 'Saved successfully!';
                        await this.fetchAndRenderModalLogHistory(this.currentRecipeId);
                        setTimeout(() => { this.elements.logStatusMsg.textContent = ''; }, 2000);
                    } catch (error) {
                        this.elements.logStatusMsg.textContent = 'Failed to save.';
                    }
                },

                async fetchUserInfo() {
                    try {
                        const identity = await this.apiRequest('/cdn-cgi/access/get-identity');
                        if (identity && identity.email) {
                            this.elements.userEmail.textContent = 'Logged in as: ' + identity.email;
                        }
                    } catch (e) {
                         this.elements.userEmail.textContent = 'Not logged in (this is normal for local testing).';
                    }
                }
            };
            app.init();
        } catch (e) {
            console.error("A fatal error occurred on page load:", e);
            document.body.innerHTML = '<div style="padding: 2rem; text-align: center; font-family: sans-serif;"><h1>Application Error</h1><p>A fatal error occurred. Please check the developer console for details.</p></div>';
        }
    });
    </script>
</body>
</html>
