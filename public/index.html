<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Recipes App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .modal { transition: opacity 0.25s ease; }
        body.modal-active { overflow: hidden; }
        .checked-item { text-decoration: line-through; color: #9ca3af; }
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            border-radius: 8px;
            color: white;
            opacity: 0;
            transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out;
            z-index: 1000;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(-20px);
        }
        .toast.success { background-color: #28a745; }
        .toast.error { background-color: #dc3545; }
        /* Star rating styles */
        .star-rating {
            display: flex;
            flex-direction: row-reverse;
            justify-content: flex-end;
            font-size: 2.5em;
            cursor: pointer;
        }
        .star-rating input { display: none; }
        .star-rating label {
            color: #ddd;
            transition: color 0.2s;
        }
        .star-rating input:checked ~ label,
        .star-rating label:hover,
        .star-rating label:hover ~ label {
            color: #fcd34d; /* Tailwind yellow-300 */
        }
        /* Drag and Drop styles */
        .drop-zone-active {
            background-color: #e0f2fe; /* Tailwind sky-100 */
            border: 2px dashed #38bdf8; /* Tailwind sky-400 */
        }
        /* Ensure confirm modal appears above all others */
        #confirm-modal {
            z-index: 60;
        }
        /* Navigation button hover effect */
        .nav-btn:hover { background-color: rgba(0,0,0,0.05); }
    </style>
</head>
<body class="bg-gray-100">

    <div id="toast-notification" class="toast"></div>

    <script>
        document.addEventListener('DOMContentLoaded', async function () {
            let currentUserEmail = null;
            let currentMealPlan = null;
            let currentRecipeId = null;
            let currentResultSet = []; // Navigation state

            const userGreeting = document.getElementById('user-greeting');
            try {
                const identityRes = await fetch('/cdn-cgi/access/get-identity');
                if (identityRes.ok) {
                    const identity = await identityRes.json();
                    currentUserEmail = identity.email;
                    const nameMap = {'nicolasj.oliver@gmail.com': 'Nick', 'rachelcasey246@gmail.com': 'Rach', 'rosieoliver168@gmail.com': 'Rosie'};
                    userGreeting.textContent = `Hello, ${nameMap[currentUserEmail] || currentUserEmail.split('@')[0]}!`;
                } else { userGreeting.textContent = 'Welcome!'; }
            } catch (e) { userGreeting.textContent = 'Welcome!'; }

            // --- Tags ---
            const tagsContainer = document.getElementById('tags-container');
            const toggleTagsBtn = document.getElementById('toggle-tags-btn');
            const tagsWrapper = document.getElementById('tags-wrapper');
            const tagsArrow = document.getElementById('tags-arrow');
            const selectedTagDisplay = document.getElementById('selected-tag-display');
            const searchContainer = document.getElementById('search-container');
            const headerActionsContainer = document.getElementById('header-actions-container');

            toggleTagsBtn.addEventListener('click', () => {
                const isTagsBecomingHidden = tagsWrapper.classList.toggle('hidden');
                searchContainer.classList.toggle('hidden', !isTagsBecomingHidden);
                headerActionsContainer.classList.toggle('hidden', !isTagsBecomingHidden);
                tagsArrow.textContent = tagsWrapper.classList.contains('hidden') ? '▼' : '▲';
                if (!tagsWrapper.classList.contains('hidden')) selectedTagDisplay.textContent = '';
            });

            async function loadAndDisplayTags() {
                try {
                    const response = await fetch('/api/tags');
                    const tags = await response.json();
                    tagsContainer.innerHTML = '';
                    tags.sort().forEach(tag => {
                        const button = document.createElement('button');
                        button.textContent = tag;
                        button.className = 'bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold py-2 px-4 border border-gray-400 rounded shadow';
                        button.addEventListener('click', () => {
                            searchRecipes('tag', tag, document.getElementById('search-results'));
                            tagsWrapper.classList.add('hidden');
                            searchContainer.classList.remove('hidden');
                            headerActionsContainer.classList.remove('hidden');
                            tagsArrow.textContent = '▼';
                            selectedTagDisplay.textContent = `: ${tag}`;
                        });
                        tagsContainer.appendChild(button);
                    });
                } catch (e) { console.error("Failed to load tags:", e); }
            }
            
            // --- Search ---
            const searchByNameInput = document.getElementById('search-by-name');
            const searchByIngredientsInput = document.getElementById('search-by-ingredients');
            const searchResultsContainer = document.getElementById('search-results');
            const clearSearchBtn = document.getElementById('clear-search-btn');

            searchByNameInput.addEventListener('input', debounce(() => searchRecipes('nameOrId', searchByNameInput.value, searchResultsContainer), 300));
            searchByIngredientsInput.addEventListener('input', debounce(() => searchRecipes('ingredients', searchByIngredientsInput.value, searchResultsContainer), 300));
            
            clearSearchBtn.addEventListener('click', () => {
                searchByNameInput.value = ''; searchByIngredientsInput.value = '';
                searchResultsContainer.innerHTML = ''; selectedTagDisplay.textContent = '';
                currentResultSet = [];
            });

            async function searchRecipes(type, query, container) {
                if (!query || query.length < 1) { container.innerHTML = ''; return; }
                let endpoint = '';
                if (type === 'nameOrId') endpoint = `/api/recipes/search?q=${query}`;
                else if (type === 'ingredients') endpoint = `/api/recipes/ingredients?q=${query}`;
                else if (type === 'tag') endpoint = `/api/recipes/tags?q=${query}`;
                
                const response = await fetch(endpoint);
                const recipes = await response.json();

                // Update navigation context only for main results
                if (container.id === 'search-results') {
                    currentResultSet = recipes.map(r => r.id);
                }

                container.innerHTML = recipes.length === 0 ? '<p class="text-gray-500">No recipes found.</p>' : '';
                recipes.forEach(recipe => {
                    const card = document.createElement('div');
                    card.className = 'bg-gray-200 p-2 rounded-lg shadow cursor-pointer hover:bg-gray-300';
                    card.draggable = true; card.dataset.recipeId = recipe.id; card.dataset.recipeName = recipe.name;
                    card.innerHTML = `<h3 class="font-semibold text-sm">(${recipe.id}) ${recipe.name}</h3>`;
                    card.addEventListener('click', () => showRecipeDetails(recipe.id));
                    card.addEventListener('dragstart', handleDragStart);
                    container.appendChild(card);
                });
            }

            // --- Navigation Logic ---
            const navigateRecipe = (direction) => {
                if (currentResultSet.length === 0) return;
                const currentIndex = currentResultSet.indexOf(parseInt(currentRecipeId));
                const nextIndex = currentIndex + direction;
                if (nextIndex >= 0 && nextIndex < currentResultSet.length) {
                    showRecipeDetails(currentResultSet[nextIndex]);
                }
            };

            // --- Recipe Modal ---
            const recipeModal = document.getElementById('recipe-modal');
            const recipeModalTitle = document.getElementById('recipe-modal-title');
            const recipeModalContent = document.getElementById('recipe-modal-content');
            
            async function showRecipeDetails(recipeId) {
                currentRecipeId = recipeId;
                const response = await fetch(`/api/recipes/${recipeId}`);
                if (!response.ok) { showToast('Could not load recipe details.', 'error'); return; }
                const recipe = await response.json();
                recipeModalTitle.textContent = `(${recipe.id}) ${recipe.name}`;

                // Navigation UI Updates
                const idx = currentResultSet.indexOf(parseInt(recipeId));
                const total = currentResultSet.length;
                if (idx !== -1 && total > 1) {
                    const label = `Recipe ${idx + 1} of ${total}`;
                    document.getElementById('modal-counter').textContent = label;
                    document.getElementById('mobile-counter-display').textContent = `${idx + 1} / ${total}`;
                    document.getElementById('prev-recipe-btn').style.display = (idx === 0) ? 'none' : 'flex';
                    document.getElementById('next-recipe-btn').style.display = (idx === total - 1) ? 'none' : 'flex';
                    document.getElementById('mobile-prev-btn').disabled = (idx === 0);
                    document.getElementById('mobile-next-btn').disabled = (idx === total - 1);
                } else {
                    document.getElementById('modal-counter').textContent = '';
                    document.getElementById('prev-recipe-btn').style.display = 'none';
                    document.getElementById('next-recipe-btn').style.display = 'none';
                }

                const servesHtml = recipe.serves ? `<p class="text-gray-600 mb-4 font-semibold">Serves: ${recipe.serves}</p>` : '';
                let ingredientsHtml = '<h4>Ingredients:</h4>';
                try {
                    const ingredientsData = JSON.parse(recipe.ingredients);
                    ingredientsData.forEach(section => {
                        ingredientsHtml += `<h5 class="font-semibold mt-2">${section.section_title}</h5>`;
                        const itemsHtml = section.items.map(ing => {
                            const fullText = `${ing.quantity || ''} ${ing.unit || ''} ${ing.name} ${ing.notes || ''}`.trim();
                             return `<li class="flex items-center">
                                <input type="checkbox" class="mr-3 h-5 w-5 ingredient-checkbox" data-name="${ing.name}" data-quantity="${ing.quantity || ''}" data-unit="${ing.unit || ''}">
                                <span>${fullText}</span>
                            </li>`;
                        }).join('');
                        ingredientsHtml += `<ul class="list-disc list-inside">${itemsHtml}</ul>`;
                    });
                } catch (e) { ingredientsHtml = `<p>${recipe.ingredients}</p>`; }

                let instructionsHtml = '<h4>Instructions:</h4>';
                try {
                    const instructionsData = JSON.parse(recipe.instructions);
                    const itemsHtml = instructionsData.map(step => `<li>${step}</li>`).join('');
                    instructionsHtml = `<ol class="list-decimal list-inside">${itemsHtml}</ol>`;
                } catch (e) { instructionsHtml = `<p class="whitespace-pre-wrap">${recipe.instructions}</p>`; }

                const ratingsSectionHtml = `<div class="border-t mt-4 pt-4"><h4 class="font-bold">Your Rating & Notes</h4><div class="star-rating my-2"><input type="radio" id="5-stars" name="rating" value="5" /><label for="5-stars">★</label><input type="radio" id="4-stars" name="rating" value="4" /><label for="4-stars">★</label><input type="radio" id="3-stars" name="rating" value="3" /><label for="3-stars">★</label><input type="radio" id="2-stars" name="rating" value="2" /><label for="2-stars">★</label><input type="radio" id="1-star" name="rating" value="1" /><label for="1-star">★</label></div><textarea id="recipe-notes" class="w-full p-2 border border-gray-300 rounded-md" rows="4" placeholder="Add your personal notes here..."></textarea><div class="text-right mt-2"><button id="save-rating-btn" data-recipe-id="${recipe.id}" class="bg-purple-500 hover:bg-purple-700 text-white p-2 rounded">Save Rating & Notes</button></div></div>`;
                const shareButtonHtml = currentUserEmail ? `<button id="share-recipe-btn" data-recipe-id="${recipe.id}" class="bg-indigo-500 hover:bg-indigo-700 text-white p-2 rounded">Share Recipe</button>` : '';

                recipeModalContent.innerHTML = `${servesHtml}${ingredientsHtml}<div class="flex justify-between items-center mt-4">${shareButtonHtml}<button id="add-to-list-btn" data-recipe-name="${recipe.name}" class="bg-green-500 text-white p-2 rounded">Add Selected to Shopping List</button></div>${instructionsHtml}<div class="border-t mt-4 pt-4"><h4 class="font-bold">Meal Log:</h4><p>You have logged this meal ${recipe.log_count} time(s).</p><div class="mt-2"><label for="eaten-date">Log this meal:</label><input type="date" id="eaten-date" class="border p-1 rounded"><button id="log-meal-btn" data-recipe-id="${recipe.id}" class="bg-blue-500 text-white p-2 rounded ml-2">Log Meal</button></div></div>${currentUserEmail ? ratingsSectionHtml : '<p class="mt-4 pt-4 border-t">Log in to add your own ratings and notes.</p>'}`;

                if (currentUserEmail && recipe.user_rating) {
                    const starInput = document.querySelector(`.star-rating input[value="${recipe.user_rating}"]`);
                    if (starInput) starInput.checked = true;
                }
                if (currentUserEmail && recipe.user_notes) document.getElementById('recipe-notes').value = recipe.user_notes;

                toggleModal(recipeModal, true);
                document.getElementById('modal-container-inner').scrollTop = 0; // Reset scroll

                document.getElementById('add-to-list-btn').addEventListener('click', handleAddToList);
                document.getElementById('log-meal-btn').addEventListener('click', handleLogMeal);
                if (currentUserEmail) {
                    document.getElementById('save-rating-btn').addEventListener('click', handleSaveRating);
                    if(document.getElementById('share-recipe-btn')) document.getElementById('share-recipe-btn').addEventListener('click', handleShareRecipe);
                }
            }

            // --- Handlers ---
            async function handleShareRecipe(e) {
                const recipeId = e.target.dataset.recipeId;
                const response = await fetch(`/api/recipes/${recipeId}/share`, { method: 'POST' });
                if (!response.ok) { showToast('Could not create share link.', 'error'); return; }
                const { token } = await response.json();
                const shareUrl = `${window.location.origin}/share/${token}`;
                document.getElementById('share-link-input').value = shareUrl;
                toggleModal(document.getElementById('share-modal'), true);
            }
            
            async function handleSaveRating(e) {
                const recipeId = e.target.dataset.recipeId;
                const ratingInput = document.querySelector('.star-rating input:checked');
                const rating = ratingInput ? ratingInput.value : null;
                const notes = document.getElementById('recipe-notes').value;
                if (!rating) { showToast('Please select a star rating.', 'error'); return; }
                await fetch('/api/ratings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ recipe_id: recipeId, rating: parseInt(rating), notes: notes }),
                });
                showToast('Rating and notes saved!', 'success');
                toggleModal(recipeModal, false);
            }

            async function handleAddToList(e) {
                const recipeName = e.target.dataset.recipeName;
                const selectedCheckboxes = document.querySelectorAll('.ingredient-checkbox:checked');
                if (selectedCheckboxes.length === 0) { showToast('Please select at least one ingredient.', 'error'); return; }
                const items = Array.from(selectedCheckboxes).map(cb => ({ name: cb.dataset.name, quantity: cb.dataset.quantity, unit: cb.dataset.unit }));
                await fetch('/api/shopping-list', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ items, recipe_name: recipeName }) });
                showToast(`${items.length} item(s) added!`, 'success');
                toggleModal(recipeModal, false);
            }

            async function handleLogMeal(e) {
                const recipeId = e.target.dataset.recipeId;
                const eatenDate = document.getElementById('eaten-date').value;
                if (!eatenDate) { showToast('Please select a date.', 'error'); return; }
                await fetch('/api/meal-log', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ recipe_id: recipeId, eaten_date: eatenDate, notes: '' }) });
                showToast('Meal logged successfully!', 'success');
                toggleModal(recipeModal, false);
            }

            // --- Shopping List / Meal Log (Unchanged Logic) ---
            async function showShoppingList() {
                const response = await fetch('/api/shopping-list');
                const items = await response.json();
                const container = document.getElementById('shopping-list-content');
                container.innerHTML = items.length === 0 ? '<p class="text-gray-500">Empty.</p>' : '';
                const grouped = items.reduce((acc, i) => { (acc[i.recipe_name] = acc[i.recipe_name] || []).push(i); return acc; }, {});
                for (const name in grouped) {
                    const div = document.createElement('div');
                    const itemsHtml = grouped[name].map(item => `<li class="flex items-center ml-4"><input type="checkbox" data-id="${item.id}" class="mr-3 h-5 w-5 shopping-item-checkbox" ${item.is_checked ? 'checked' : ''}><span class="${item.is_checked ? 'checked-item' : ''}">${item.quantity || ''} ${item.unit || ''} ${item.ingredient_name}</span></li>`).join('');
                    div.innerHTML = `<h4 class="font-bold text-lg">${name}</h4><ul class="list-none">${itemsHtml}</ul>`;
                    container.appendChild(div);
                }
                toggleModal(document.getElementById('shopping-list-modal'), true);
            }

            document.getElementById('shopping-list-button').addEventListener('click', showShoppingList);
            document.getElementById('update-checked-btn').addEventListener('click', async () => {
                const updates = Array.from(document.querySelectorAll('.shopping-item-checkbox')).map(cb => ({ id: cb.dataset.id, is_checked: cb.checked }));
                await fetch('/api/shopping-list/update', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ updates }) });
                showToast('List updated!', 'success'); await showShoppingList();
            });
            document.getElementById('clear-checked-items-btn').addEventListener('click', () => {
                showConfirm('Clear checked items?', async () => { await fetch('/api/shopping-list/clear', { method: 'DELETE' }); await showShoppingList(); showToast('Cleared!', 'success'); });
            });

            document.getElementById('meal-log-button').addEventListener('click', async () => {
                const res = await fetch('/api/meal-log');
                if (!res.ok) { showToast('Please log in.', 'error'); return; }
                const logs = await res.json();
                const container = document.getElementById('meal-log-content');
                container.innerHTML = logs.length === 0 ? '<p class="text-gray-500">No logs.</p>' : '';
                const grouped = logs.reduce((acc, log) => { (acc[log.eaten_date] = acc[log.eaten_date] || []).push(log); return acc; }, {});
                for (const d in grouped) {
                    const div = document.createElement('div');
                    const html = grouped[d].map(l => `<li class="ml-4">${l.recipe_name}</li>`).join('');
                    div.innerHTML = `<h4 class="font-bold text-lg">${new Date(d + 'T00:00:00').toLocaleDateString('en-GB', {weekday:'long',year:'numeric',month:'long',day:'numeric'})}</h4><ul class="list-disc list-inside">${html}</ul>`;
                    container.appendChild(div);
                }
                toggleModal(document.getElementById('meal-log-modal'), true);
            });

            // --- Meal Planner (Unchanged Logic) ---
            document.getElementById('meal-planner-button').addEventListener('click', async () => {
                if (!currentUserEmail) { showToast('Please log in.', 'error'); return; }
                document.getElementById('plan-calendar-view').classList.add('hidden');
                document.getElementById('plan-management-view').classList.remove('hidden');
                document.getElementById('meal-planner-title').textContent = 'Meal Planner';
                toggleModal(document.getElementById('meal-planner-modal'), true);
                const res = await fetch('/api/meal-plans');
                const plans = await res.json();
                const list = document.getElementById('meal-plans-list');
                list.innerHTML = plans.length === 0 ? '<p class="text-gray-500">No plans.</p>' : '';
                plans.forEach(p => {
                    const div = document.createElement('div'); div.className = 'bg-white p-3 rounded-md shadow cursor-pointer hover:bg-gray-100'; div.textContent = p.name;
                    div.addEventListener('click', async () => {
                        currentMealPlan = p; document.getElementById('meal-planner-title').textContent = p.name;
                        document.getElementById('plan-management-view').classList.add('hidden');
                        document.getElementById('plan-calendar-view').classList.remove('hidden');
                        const detailsRes = await fetch(`/api/meal-plans/${p.id}`);
                        const details = await detailsRes.json();
                        const cal = document.getElementById('calendar-body'); cal.innerHTML = '';
                        ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'].forEach(day => {
                            const cell = document.createElement('div'); cell.className = 'border p-2 min-h-[150px] drop-zone'; cell.dataset.day = day; cell.dataset.mealTime = 'Dinner';
                            const rList = document.createElement('div'); rList.className = 'recipe-list space-y-1';
                            details.recipes.filter(r => r.day_of_week === day).forEach(r => {
                                const item = document.createElement('div'); item.className = 'bg-blue-100 p-1 rounded text-xs'; item.textContent = r.recipe_name; rList.appendChild(item);
                            });
                            cell.appendChild(rList); cal.appendChild(cell);
                        });
                        addDropZoneListeners();
                    });
                    list.appendChild(div);
                });
            });

            document.getElementById('create-plan-btn').addEventListener('click', async () => {
                const name = document.getElementById('new-plan-name').value.trim();
                if (!name) return;
                await fetch('/api/meal-plans', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name }) });
                document.getElementById('new-plan-name').value = ''; showToast('Created!', 'success');
            });

            document.getElementById('generate-shopping-list-btn').addEventListener('click', async () => {
                if (!currentMealPlan) return;
                showConfirm(`Add ingredients from "${currentMealPlan.name}" to shopping list?`, async () => {
                    const res = await fetch(`/api/meal-plans/${currentMealPlan.id}/shopping-list`, { method: 'POST' });
                    if (res.ok) { const data = await res.json(); showToast(`${data.items_added} items added!`, 'success'); toggleModal(document.getElementById('meal-planner-modal'), false); }
                });
            });

            document.getElementById('back-to-plans-btn').addEventListener('click', () => {
                document.getElementById('plan-calendar-view').classList.add('hidden'); document.getElementById('plan-management-view').classList.remove('hidden');
            });

            document.getElementById('planner-search-input').addEventListener('input', debounce(() => searchRecipes('nameOrId', document.getElementById('planner-search-input').value, document.getElementById('planner-search-results')), 300));

            // --- Drag & Drop ---
            function handleDragStart(e) { e.dataTransfer.setData('text/plain', JSON.stringify({ id: e.target.dataset.recipeId, name: e.target.dataset.recipeName })); }
            function addDropZoneListeners() {
                document.querySelectorAll('.drop-zone').forEach(z => {
                    z.addEventListener('dragover', (e) => { e.preventDefault(); e.currentTarget.classList.add('drop-zone-active'); });
                    z.addEventListener('dragleave', (e) => { e.preventDefault(); e.currentTarget.classList.remove('drop-zone-active'); });
                    z.addEventListener('drop', async (e) => {
                        e.preventDefault(); const target = e.currentTarget; target.classList.remove('drop-zone-active');
                        const data = JSON.parse(e.dataTransfer.getData('text/plain'));
                        const res = await fetch('/api/meal-plan-recipes', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ meal_plan_id: currentMealPlan.id, recipe_id: data.id, day_of_week: target.dataset.day, meal_time: target.dataset.mealTime }) });
                        if (res.ok) { showToast(`${data.name} added.`, 'success'); const item = document.createElement('div'); item.className = 'bg-blue-100 p-1 rounded text-xs'; item.textContent = data.name; target.querySelector('.recipe-list').appendChild(item); }
                    });
                });
            }

            // --- General UI ---
            const confirmModal = document.getElementById('confirm-modal');
            const confirmModalText = document.getElementById('confirm-modal-text');
            const confirmOkBtn = document.getElementById('confirm-ok-btn');
            const shareModal = document.getElementById('share-modal');
            let confirmCallback = null;

            function showConfirm(m, onC) { confirmModalText.textContent = m; confirmCallback = onC; toggleModal(confirmModal, true); }
            confirmOkBtn.addEventListener('click', () => { if (confirmCallback) confirmCallback(); toggleModal(confirmModal, false); });
            document.getElementById('confirm-cancel-btn').addEventListener('click', () => toggleModal(confirmModal, false));
            document.getElementById('copy-share-link-btn').addEventListener('click', () => {
                const input = document.getElementById('share-link-input'); input.select(); document.execCommand('copy'); showToast('Copied!', 'success'); toggleModal(shareModal, false);
            });

            document.querySelectorAll('.modal-close, .modal-overlay').forEach(b => b.addEventListener('click', () => {
                document.querySelectorAll('.modal').forEach(m => toggleModal(m, false));
            }));

            function toggleModal(m, show) { if (!m) return; m.classList.toggle('opacity-0', !show); m.classList.toggle('pointer-events-none', !show); document.body.classList.toggle('modal-active', show); }

            function debounce(f, w) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => f.apply(this, a), w); }; }

            function showToast(m, t = 'success') {
                const n = document.getElementById('toast-notification'); n.textContent = m; n.className = `toast ${t} show`;
                setTimeout(() => { n.className = n.className.replace('show', ''); }, 3000);
            }

            document.getElementById('print-recipe-btn').addEventListener('click', () => {
                const container = document.getElementById('printable-recipe');
                container.innerHTML = `<div style="font-family: sans-serif; padding: 20px;"><h1>${document.getElementById('recipe-modal-title').textContent}</h1>${document.getElementById('recipe-modal-content').innerHTML}</div>`;
                window.print();
            });

            // Navigation Button Events
            document.getElementById('prev-recipe-btn').addEventListener('click', () => navigateRecipe(-1));
            document.getElementById('next-recipe-btn').addEventListener('click', () => navigateRecipe(1));
            document.getElementById('mobile-prev-btn').addEventListener('click', () => navigateRecipe(-1));
            document.getElementById('mobile-next-btn').addEventListener('click', () => navigateRecipe(1));
            
            // Keyboard Navigation
            document.addEventListener('keydown', (e) => {
                if (recipeModal.classList.contains('opacity-0')) return;
                if (e.key === 'ArrowLeft') navigateRecipe(-1);
                if (e.key === 'ArrowRight') navigateRecipe(1);
                if (e.key === 'Escape') toggleModal(recipeModal, false);
            });

            // Initial load
            loadAndDisplayTags();
            fetch('/api/build-info').then(r => r.json()).then(d => {
                document.getElementById('build-timestamp').textContent = `Live Status: ${new Date(d.timestamp).toLocaleString('en-GB')}`;
            }).catch(() => { document.getElementById('build-timestamp').textContent = 'Live Status: Online'; });
        });
    </script>
</body>
</html>
